<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="เทียบแนวภาพขาวดำ 8 แบบจากมุมเฉียงท้ายรถ พร้อมโปสเตอร์ต้นฉบับอ้างอิง">
  <title>Land and Coffee 06 | Graphic Design</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 system-ui, sans-serif; background: #f7f6f3; color: #181815; }
    * { box-sizing: border-box; }
    main { max-width: 1160px; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    header { padding: 1.5rem 0 1.75rem; border-bottom: 1px solid #c4c0b7; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.06; letter-spacing: -.04em; margin: 0; }
    p { color: #52504a; margin: .85rem 0 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 1rem; }
    figure { margin: 0; background: #fff; border: 1px solid #d6d3cc; }
    figure a { display: grid; place-items: center; aspect-ratio: 808 / 560; padding: .7rem; }
    figure img { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; }
    figcaption { border-top: 1px solid #e4e1dc; padding: .65rem .8rem; display: grid; gap: .1rem; }
    figcaption span { color: #52504a; font-size: .9rem; }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid #145fc1; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Land and Coffee 06</h1>
      <p>แผ่นเทียบแนวภาพขาวดำ 8 แบบในมุมเฉียงท้ายรถ พร้อมต้นฉบับอ้างอิง กดที่ภาพเพื่อเปิดขนาดเต็ม</p>
    </header>
    <div class="grid">
      <figure>
        <a href="art/00-original.png">
          <img src="art/00-original.png" alt="โปสเตอร์ต้นฉบับที่ใช้อ้างอิงมุมภาพ" width="1076" height="1522">
        </a>
        <figcaption><strong>Original</strong><span>โปสเตอร์ต้นฉบับที่ใช้อ้างอิงมุมภาพ</span></figcaption>
      </figure>
      <figure>
        <a href="art/01-chisel-open-contour.png">
          <img src="art/01-chisel-open-contour.png" alt="เส้นโปร่ง น้ำหนักหัวปากกาแบน" width="808" height="560">
        </a>
        <figcaption><strong>Style 01</strong><span>เส้นโปร่ง น้ำหนักหัวปากกาแบน</span></figcaption>
      </figure>
      <figure>
        <a href="art/02-fine-rounded-outline.png">
          <img src="art/02-fine-rounded-outline.png" alt="ขอบมนบาง เห็นรายละเอียดรถ" width="808" height="560">
        </a>
        <figcaption><strong>Style 02</strong><span>ขอบมนบาง เห็นรายละเอียดรถ</span></figcaption>
      </figure>
      <figure>
        <a href="art/03-chisel-rounded-shapes.png">
          <img src="art/03-chisel-rounded-shapes.png" alt="รูปทรงมน ขอบกรอบกระจกเข้ม" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 03</strong><span>รูปทรงมน ขอบกรอบกระจกเข้ม</span></figcaption>
      </figure>
      <figure>
        <a href="art/04-soft-rounded-contour.png">
          <img src="art/04-soft-rounded-contour.png" alt="เส้นโค้งมน ลดรายละเอียดรถ" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 04</strong><span>เส้นโค้งมน ลดรายละเอียดรถ</span></figcaption>
      </figure>
      <figure>
        <a href="art/05-hand-drawn-detail.png">
          <img src="art/05-hand-drawn-detail.png" alt="เส้นวาดมือ รายละเอียดฝาท้าย" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 05</strong><span>เส้นวาดมือ รายละเอียดฝาท้าย</span></figcaption>
      </figure>
      <figure>
        <a href="art/06-chisel-tailgate-detail.png">
          <img src="art/06-chisel-tailgate-detail.png" alt="หัวปากกาแบน เน้นขีดบนฝาท้าย" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 06</strong><span>หัวปากกาแบน เน้นขีดบนฝาท้าย</span></figcaption>
      </figure>
      <figure>
        <a href="art/07-geometric-pictogram.png">
          <img src="art/07-geometric-pictogram.png" alt="รูปทรงเรียบ พื้นดำเด่น" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 07</strong><span>รูปทรงเรียบ พื้นดำเด่น</span></figcaption>
      </figure>
      <figure>
        <a href="art/08-hand-inked-monochrome.png">
          <img src="art/08-hand-inked-monochrome.png" alt="เส้นวาดมือขาวดำ" width="808" height="560" loading="lazy">
        </a>
        <figcaption><strong>Style 08</strong><span>เส้นวาดมือขาวดำ</span></figcaption>
      </figure>
    </div>
    <p><a href="art/rear-view-style-options.png">เปิดแผ่นเทียบทั้ง 9 ภาพ</a></p>
  </main>
</body>
</html>
